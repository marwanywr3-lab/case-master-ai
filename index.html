<!-- index.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CaseMaster AI | محاكي التحقيق الجنائي القانوني</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ef4444' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'></circle><line x1='21' y1='21' x2='16.65' y2='16.65'></line></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    try {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              noir: {
                950: '#07080b',
                900: '#0d0f14',
                850: '#141820',
                800: '#1c222e',
                750: '#242c3b',
                700: '#2e384b',
                accent: '#ef4444',
              }
            },
            fontFamily: {
              sans: ['Tajawal', 'sans-serif'],
              mono: ['"IBM Plex Mono"', 'monospace']
            }
          }
        }
      };
    } catch(e) {
      console.warn("Tailwind config loaded in fallback mode", e);
    }
  </script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background-color: #07080b; color: #e2e8f0; overflow: hidden;
      font-family: 'Tajawal', sans-serif;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0d0f14; }
    ::-webkit-scrollbar-thumb { background: #242c3b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #ef4444; }
    #app { height: 100vh; height: 100dvh; }
    #boot-warning { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; background: #7f1d1d; color: #fff; padding: 8px 12px; font-size: 12px; text-align: center; display: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-noir-950 text-slate-200 h-full w-full overflow-hidden">
  <div id="boot-warning">تعذر تحميل Tailwind CSS (cdn.tailwindcss.com). تأكد من الإنترنت أو افتح الصفحة من متصفح آخر.</div>
  <div id="app" class="h-full w-full flex overflow-hidden relative"></div>

  <script>
    function showFatal(err) {
      const app = document.getElementById('app');
      const msg = String((err && err.stack) || err);
      if (app) app.innerHTML = '<pre style="color:#f87171;padding:16px;direction:ltr;white-space:pre-wrap;font-size:12px;overflow:auto;height:100%">' + msg.replace(/</g, '&lt;') + '</pre>';
    }
    window.addEventListener('error', e => showFatal(e.error || e.message));
    window.addEventListener('unhandledrejection', e => showFatal(e.reason));

    // Safe Storage to prevent iframe SecurityError crashes
    const memoryStore = {};
    const safeStore = {
      getItem: (key) => {
        try {
          return window.localStorage.getItem(key);
        } catch (e) {
          return memoryStore[key] || null;
        }
      },
      setItem: (key, val) => {
        try {
          window.localStorage.setItem(key, val);
        } catch (e) {
          memoryStore[key] = String(val);
        }
      },
      removeItem: (key) => {
        try {
          window.localStorage.removeItem(key);
        } catch (e) {
          delete memoryStore[key];
        }
      }
    };

    const STORAGE_KEYS = {
      API_KEY: 'casemaster_gemini_api_key',
      SELECTED_MODEL: 'casemaster_gemini_model',
      CASES_LIST: 'casemaster_cases_history',
      ACTIVE_CASE_ID: 'casemaster_active_case_id',
      NOTEPAD: 'casemaster_investigator_notepad',
    };

    const SUPPORTED_MODELS = {
      LITE: 'gemini-3.5-flash-lite',
      FLASH: 'gemini-3.8-flash',
      PREVIEW: 'gemini-3-flash-preview'
    };

    const initialCases = (() => {
      try {
        const saved = safeStore.getItem(STORAGE_KEYS.CASES_LIST);
        const parsed = saved ? JSON.parse(saved) : null;
        if (Array.isArray(parsed)) return parsed.filter(c => c && c.id !== 'case-demo-1');
      } catch(e) {}
      return [];
    })();

    const state = {
      apiKey: safeStore.getItem(STORAGE_KEYS.API_KEY) || '',
      selectedModel: safeStore.getItem(STORAGE_KEYS.SELECTED_MODEL) || SUPPORTED_MODELS.LITE,
      cases: initialCases,
      activeCaseId: initialCases[0]?.id || null,
      notepadContent: safeStore.getItem(STORAGE_KEYS.NOTEPAD) || '',
      mobileTab: 'investigation',
      dossierTab: 'evidence',
      isSidebarOpen: false,
      isSettingsOpen: false,
      isNewCaseOpen: false,
      isIndictmentOpen: false,
      
      draft: null,
      isGeneratingCase: false,
      newCaseError: '',
      difficulty: 'متوسط',
      legalSystem: 'السعودي',
      depth: 'متوسط',
      customSeed: '',

      isInvestigationLoading: false,
      isAssistantLoading: false,
      isIndictmentLoading: false,
      investigationError: '',
      assistantError: '',
    };

    function saveCases() {
      try {
        safeStore.setItem(STORAGE_KEYS.CASES_LIST, JSON.stringify(state.cases));
      } catch(e) {}
    }

    function getActiveCase() {
      return state.cases.find(c => c.id === state.activeCaseId) || state.cases[0] || null;
    }

    function deobfuscate(str) {
      try {
        return JSON.parse(decodeURIComponent(atob(str)));
      } catch {
        try { return JSON.parse(str); } catch { return {}; }
      }
    }

    function authHeaders() {
      const h = { 'Content-Type': 'application/json' };
      if (state.apiKey) h['x-goog-api-key'] = state.apiKey.trim();
      return h;
    }

    async function callGemini(contents, systemInstruction) {
      const modelToUse = state.selectedModel || SUPPORTED_MODELS.LITE;
      // If user left API key empty, pass empty string so Canvas runtime handles it, or use provided key
      const keyParam = '';
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelToUse)}:generateContent${keyParam}`;
      
      const body = {
        contents,
        generationConfig: { maxOutputTokens: 4096 }
      };
      if (systemInstruction) {
        body.systemInstruction = { parts: [{ text: systemInstruction }] };
      }

      let res;
      try {
        res = await fetch(endpoint, {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify(body),
        });
      } catch (networkErr) {
        throw new Error('تعذر الاتصال بالخادم. تحقق من اتصال الإنترنت.');
      }

      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const msg = data?.error?.message || res.statusText;
        if (res.status === 404) {
          // Fallback to flash preview if model name is experimental
          const fallbackEndpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent${keyParam}`;
          const fallbackRes = await fetch(fallbackEndpoint, {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify(body),
          });
          const fallbackData = await fallbackRes.json().catch(() => ({}));
          if (fallbackRes.ok && fallbackData.candidates?.[0]?.content?.parts?.[0]?.text) {
            return fallbackData.candidates[0].content.parts[0].text;
          }
        }
        throw new Error(`خطأ من Gemini [${res.status}]: ${msg}`);
      }

      const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) throw new Error('لم يتم إرجاع أي نص من النموذج.');
      return text;
    }

    function extractJSON(text) {
      const match = text.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
      const str = match ? match[1].trim() : text.trim();
      try { return JSON.parse(str); }
      catch {
        const s = str.indexOf('{'), e = str.lastIndexOf('}');
        if (s !== -1 && e > s) return JSON.parse(str.substring(s, e + 1));
        throw new Error('تعذر قراءة بيانات JSON من النموذج.');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;
      const activeCase = getActiveCase();

      app.innerHTML = `
        <!-- Sidebar Drawer (Mobile) / Permanent (Desktop) -->
        ${state.isSidebarOpen ? '<div onclick="state.isSidebarOpen = false; render();" class="fixed inset-0 z-40 bg-black/75 backdrop-blur-sm lg:hidden"></div>' : ''}
        
        <aside class="fixed lg:static inset-y-0 right-0 z-50 w-72 sm:w-80 lg:w-64 xl:w-72 h-full bg-noir-950 border-l lg:border-l-0 lg:border-r border-noir-800 flex flex-col flex-shrink-0 select-none transition-transform duration-300 ${state.isSidebarOpen ? 'translate-x-0' : 'translate-x-full lg:translate-x-0'}">
          <div class="h-14 px-4 border-b border-noir-800 flex items-center justify-between bg-noir-900/80">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg bg-red-600/20 border border-red-500/50 flex items-center justify-center text-red-500 font-bold text-sm">⚖️</div>
              <div>
                <h1 class="text-xs font-black tracking-wide text-slate-100 uppercase">CaseMaster <span class="text-red-500">AI</span></h1>
                <p class="text-[10px] text-slate-400 font-mono">محاكي التحقيق الجنائي</p>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="state.isSettingsOpen = true; render();" class="p-2 rounded-lg border transition ${state.apiKey ? 'text-slate-400 hover:text-white bg-noir-850 border-noir-800' : 'text-emerald-400 bg-emerald-950/40 border-emerald-600/50'}" title="الإعدادات">⚙️</button>
              <button onclick="state.isSidebarOpen = false; render();" class="lg:hidden p-2 rounded-lg bg-noir-850 text-slate-400 hover:text-white border border-noir-800">✕</button>
            </div>
          </div>

          <div class="p-3 border-b border-noir-800">
            <button onclick="state.isNewCaseOpen = true; state.isSidebarOpen = false; render();" class="w-full py-2.5 px-3 rounded-lg bg-red-600 hover:bg-red-500 text-white text-xs font-bold shadow-md transition flex items-center justify-center gap-2 min-h-[44px]">
              + فتح ملف قضية جديدة
            </button>
          </div>

          <div class="flex-1 overflow-y-auto p-2.5 space-y-1.5">
            <div class="px-2 py-1 flex items-center justify-between text-[10px] font-mono text-slate-500 uppercase">
              <span>سجل القضايا (${state.cases.length})</span>
              <span>الحالة</span>
            </div>
            ${state.cases.map(c => `
              <div onclick="state.activeCaseId = '${c.id}'; state.isSidebarOpen = false; render();" class="p-3 rounded-lg cursor-pointer border transition text-right ${c.id === (activeCase?.id) ? 'bg-noir-850 border-red-500/60 shadow-sm' : 'bg-noir-900/50 border-noir-800 hover:bg-noir-850 text-slate-400'}">
                <div class="flex items-center justify-between gap-1 mb-1">
                  <span class="text-xs font-bold truncate ${c.id === (activeCase?.id) ? 'text-white' : 'text-slate-300'}">${escapeHtml(c.title)}</span>
                  <span class="text-[9px] px-1.5 py-0.5 rounded font-mono border ${c.isSolved ? 'bg-emerald-950/60 text-emerald-400 border-emerald-500/30' : 'bg-red-950/50 text-red-400 border-red-500/30'}">${c.isSolved ? 'مغلقة' : 'جارية'}</span>
                </div>
                <div class="flex items-center justify-between text-[10px] text-slate-500 font-mono">
                  <span>${c.parameters?.legalSystem || 'نظام'} • ${c.parameters?.difficulty || 'متوسط'}</span>
                  <button onclick="event.stopPropagation(); if (confirm('حذف هذه القضية نهائياً؟')) deleteCase('${c.id}');" class="hover:text-red-400 p-1 rounded transition text-xs" title="حذف">🗑️</button>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="p-3 border-t border-noir-800 bg-noir-900/50 flex items-center justify-between text-[11px] font-mono">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              <span class="text-slate-300">المحرك جاهز للتحقيق</span>
            </div>
            <span class="text-[10px] text-slate-400 bg-noir-800 px-1.5 py-0.5 rounded border border-noir-750">${escapeHtml(state.selectedModel)}</span>
          </div>
        </aside>

        <!-- Main Workspace Area -->
        <main class="flex-1 flex flex-col h-full min-w-0 overflow-hidden relative">
          <!-- Top Header on Mobile/Tablet -->
          <header class="lg:hidden flex items-center justify-between border-b border-noir-800 bg-noir-900 px-3 py-2 z-30 flex-shrink-0">
            <div class="flex items-center gap-2">
              <button onclick="state.isSidebarOpen = true; render();" class="p-2 rounded bg-noir-850 text-slate-300 border border-noir-800">☰</button>
              <div class="truncate max-w-[170px]">
                <h2 class="text-xs font-bold text-slate-100 truncate">${activeCase ? escapeHtml(activeCase.title) : 'CaseMaster AI'}</h2>
                ${activeCase ? `<span class="text-[10px] text-red-400 font-mono">نظام ${escapeHtml(activeCase.parameters?.legalSystem)}</span>` : ''}
              </div>
            </div>
            <button onclick="state.isNewCaseOpen = true; render();" class="text-xs font-bold bg-red-600/20 border border-red-500/40 text-red-300 px-2.5 py-1.5 rounded">+ قضية</button>
          </header>

          ${renderActiveCaseWorkspace(activeCase)}
        </main>

        <!-- Modals -->
        ${state.isSettingsOpen ? renderSettingsModal() : ''}
        ${state.isNewCaseOpen ? renderNewCaseModal() : ''}
        ${state.isIndictmentOpen ? renderIndictmentModal(activeCase) : ''}
      `;

      bindEvents();
    }

    const isDesktop = () => window.matchMedia('(min-width: 1024px)').matches;
    let lastDesktop = isDesktop();
    window.addEventListener('resize', () => {
      if (isDesktop() !== lastDesktop) { lastDesktop = isDesktop(); render(); }
    });

    function renderActiveCaseWorkspace(c) {
      if (!c) return `<div class="flex-1 flex flex-col items-center justify-center gap-4 p-6 text-center">
        <div class="text-5xl">⚖️</div>
        <h2 class="text-lg font-bold text-slate-100">مرحباً بك في CaseMaster AI</h2>
        <p class="text-sm text-slate-400 max-w-sm leading-relaxed">ابدأ بفتح ملف قضية جديدة، وسيتم توليدها بالذكاء الاصطناعي حسب النظام القضائي والصعوبة التي تختارها.</p>
        ${state.apiKey ? '' : '<p class="text-xs text-amber-400">لا تنسَ إضافة مفتاح Gemini API من الإعدادات ⚙️ أولاً.</p>'}
        <button onclick="state.isNewCaseOpen = true; render();" class="px-5 py-2.5 rounded-lg bg-red-600 hover:bg-red-500 text-white text-sm font-bold">+ فتح ملف قضية جديدة</button>
      </div>`;
      if (isDesktop()) {
        return `<div class="flex flex-1 h-full min-h-0 min-w-0 overflow-hidden">
          ${renderAssistantColumn(c)}${renderInvestigationColumn(c)}${renderDossierColumn(c)}</div>`;
      }
      const tabs = [
        ['investigation', '🔍', 'المسرح والاستجواب', 'bg-red-600/20 text-red-400 border border-red-500/40'],
        ['assistant', '⚖️', 'المستشار القانوني', 'bg-sky-600/20 text-sky-400 border border-sky-500/40'],
        ['dossier', '📁', 'الأدلة والملاحظات', 'bg-amber-600/20 text-amber-400 border border-amber-500/40']
      ];
      const body = state.mobileTab === 'assistant' ? renderAssistantColumn(c)
                 : state.mobileTab === 'dossier' ? renderDossierColumn(c)
                 : renderInvestigationColumn(c);
      return `<div class="flex-1 flex flex-col min-h-0 overflow-hidden">
        <div class="flex-1 min-h-0 overflow-hidden flex">${body}</div>
        <nav class="border-t border-noir-800 bg-noir-900 px-2 py-1.5 flex items-center justify-around gap-1 flex-shrink-0">
          ${tabs.map(([k, ico, label, active]) => `
            <button onclick="state.mobileTab = '${k}'; render();" class="flex-1 py-1.5 rounded text-[11px] font-bold transition flex flex-col items-center ${state.mobileTab === k ? active : 'text-slate-400'}">
              <span class="text-sm">${ico}</span><span>${label}</span>
            </button>`).join('')}
        </nav></div>`;
    }

    function renderInvestigationColumn(c) {
      return `
        <div class="flex-1 h-full min-w-0 flex flex-col bg-noir-900 border-x-0 lg:border-x border-noir-800">
          <div class="h-14 px-4 border-b border-noir-800 bg-noir-950/80 flex items-center justify-between">
            <div class="truncate">
              <h2 class="text-xs sm:text-sm font-bold text-slate-100 truncate">${escapeHtml(c.title)}</h2>
              <p class="text-[10px] text-slate-400 font-mono truncate">المسرح: ${escapeHtml(c.dossier?.crimeSceneLocation)} • نظام ${escapeHtml(c.parameters?.legalSystem)}</p>
            </div>
            <div>
              ${c.isSolved
                ? '<span class="text-xs font-bold text-emerald-400 bg-emerald-950/50 border border-emerald-500/40 px-3 py-1 rounded-full">✓ مغلقة</span>'
                : '<button onclick="state.isIndictmentOpen = true; render();" class="text-xs font-bold bg-red-600/20 hover:bg-red-600/30 border border-red-500/50 text-red-300 px-3 py-1.5 rounded-lg transition">⚖️ تقديم لائحة الاتهام</button>'
              }
            </div>
          </div>

          <div id="investigation-messages" class="flex-1 overflow-y-auto p-4 space-y-3.5">
            ${c.investigationChat.map(m => `
              <div class="flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}">
                <span class="text-[10px] font-mono mb-1 ${m.sender === 'user' ? 'text-red-400' : 'text-slate-400'}">
                  ${m.sender === 'user' ? 'المحقق' : 'إدارة المسرح والاستجواب'} • ${escapeHtml(m.timestamp)}
                </span>
                <div class="p-3.5 rounded-xl text-xs sm:text-sm leading-relaxed whitespace-pre-line border max-w-[90%] sm:max-w-[80%] ${
                  m.sender === 'user' ? 'bg-red-950/30 border-red-500/40 text-slate-100' : 'bg-noir-850 border-noir-800 text-slate-200 shadow-md'
                }">${escapeHtml(m.text)}</div>
              </div>
            `).join('')}
            ${state.isInvestigationLoading ? '<div class="text-xs text-red-400 p-2.5 bg-noir-850 rounded border border-noir-800 animate-pulse">جاري التحري واستجواب الأطراف وفحص المسرح...</div>' : ''}
            ${state.investigationError ? `<div class="text-xs text-red-300 p-2.5 bg-red-950/50 rounded border border-red-600/40">${escapeHtml(state.investigationError)}</div>` : ''}
          </div>

          ${!c.isSolved ? `
            <div class="px-3 py-2 border-t border-noir-800 bg-noir-950/50 flex gap-2 overflow-x-auto text-xs no-scrollbar">
              <button onclick="sendInvestigationAction('أريد فحص مسرح الجريمة بحثاً عن آثار أقدام أو بصمات أو دلائل مادية جديدة.');" class="px-2.5 py-1.5 rounded bg-noir-850 hover:bg-noir-800 border border-noir-800 text-slate-300 flex-shrink-0">🔍 مسح المسرح</button>
              <button onclick="sendInvestigationAction('اطلب تقرير الطب الشرعي المفصل حول وقت وطريقة الوفاة بدقة.');" class="px-2.5 py-1.5 rounded bg-noir-850 hover:bg-noir-800 border border-noir-800 text-slate-300 flex-shrink-0">🩺 تقرير الطب الشرعي</button>
              ${(c.dossier?.suspects || []).map(s => `
                <button onclick="sendInvestigationAction('استدعِ المشتبه به \\'${escapeHtml(s.name)}\\' واستجوبه حول مكان تواجده وعلاقته بالحادثة.');" class="px-2.5 py-1.5 rounded bg-noir-850 hover:bg-noir-800 border border-noir-800 text-amber-300 flex-shrink-0">👤 استجواب ${escapeHtml(s.name)}</button>
              `).join('')}
            </div>
            
            <div class="p-3 border-t border-noir-800 bg-noir-950">
              <form id="investigation-form" onsubmit="handleInvestigationSubmit(event);" class="flex gap-2">
                <input id="investigation-input" type="text" placeholder="وجه سؤالاً، استدعِ شاهداً، أو اطلب إجراءً جنائياً..." class="flex-1 px-3.5 py-2.5 rounded-lg bg-noir-850 border border-noir-800 text-xs sm:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-500 min-h-[42px]" />
                <button type="submit" class="px-4 py-2.5 rounded-lg bg-red-600 hover:bg-red-500 text-white font-bold text-xs">إرسال</button>
              </form>
            </div>
          ` : `
            <div class="p-3 border-t border-noir-800 bg-noir-950 text-center text-xs text-slate-400">تم إغلاق ملف القضية وصدور الحكم النهائي.</div>
          `}
        </div>
      `;
    }

    function renderAssistantColumn(c) {
      return `
        <div class="w-full lg:w-80 xl:w-96 h-full flex flex-col bg-noir-950 border-r border-noir-800 flex-shrink-0">
          <div class="h-14 px-4 border-b border-noir-800 bg-noir-900/80 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <div class="w-7 h-7 rounded-lg bg-sky-500/20 text-sky-400 flex items-center justify-center text-xs">⚖️</div>
              <div>
                <h3 class="text-xs font-bold text-slate-100">المستشار القانوني</h3>
                <p class="text-[10px] text-sky-400 font-mono">النظام ${escapeHtml(c.parameters?.legalSystem || 'السعودي')}</p>
              </div>
            </div>

    function deleteCase(id) {
      state.cases = state.cases.filter(c => c.id !== id);
      if (state.activeCaseId === id) {
        state.activeCaseId = state.cases.length > 0 ? state.cases[0].id : null;
      }
      saveCases();
      render();

    function handleSettingsSave(e) {
      e.preventDefault();

      state.apiKey = key;
      safeStore.setItem(STORAGE_KEYS.API_KEY, key);
      safeStore.setItem(STORAGE_KEYS.SELECTED_MODEL, state.selectedModel);
      state.isSettingsOpen = false;
      render();

    "victimName": "اسم الضحية",
    "victimAge": "العمر",
    "victimOccupation": "المهنة / الصفة",
    "crimeSceneLocation": "تحديد مسرح الجريمة بالتفصيل",
    "timeOfIncident": "الوقت والظروف المحيطة",
    "initialEvidence": [
      { "id": "ev-1", "name": "اسم الدليل الأولي", "type": "أثر مادي / شهادة", "description": "وصف مفصل" }
    ],
    "suspects": [
      { "id": "susp-1", "name": "اسم المشتبه به", "role": "صفته وعلاقته بالضحية", "alibi": "ادعاؤه الأولي" }
    ]
  },
  "secretSolution": {
    "culpritName": "اسم الجاني الحقيقي من القائمة",
    "motive": "الدافع الحقيقي",
    "weaponOrMethod": "أداة الجريمة أو طريقة التنفيذ",
    "keyEvidence": "الدليل القاطع الذي يدين الجاني",
    "flawInAlibi": "الثغرة الخفية في ادعائه",
    "fullNarrative": "السرد الكامل لما حدث خلف الكواليس"
  }
}
      `.trim();

      const userPrompt = state.customSeed
        ? `أنشئ قضية مستوحاة من الفكرة: "${state.customSeed}". التزم بـ JSON حصراً.`
        : 'أنشئ قضية جنائية جديدة متكاملة بصيغة JSON الحصرية الآن.';

      try {
        const raw = await callGemini([{ role: 'user', parts: [{ text: userPrompt }] }], systemPrompt);
        state.draft = extractJSON(raw);
      } catch (err) {
        state.newCaseError = err.message || 'فشل توليد القضية.';
      } finally {
        state.isGeneratingCase = false;
        render();
      }
    }

    function acceptCaseDraft() {
      if (!state.draft) return;
      const newId = `case-${Date.now()}`;
      const newCase = {
        id: newId,
        title: state.draft.title || 'قضية جنائية جديدة',
        briefingSummary: state.draft.briefingSummary || '',
        parameters: { difficulty: state.difficulty, legalSystem: state.legalSystem, depth: state.depth },
        dossier: state.draft.dossier || {},
        evidenceList: state.draft.dossier?.initialEvidence || [],
        encryptedSecretSolution: btoa(encodeURIComponent(JSON.stringify(state.draft.secretSolution || {}))),
        isSolved: false,
        indictmentResult: null,
        investigationChat: [
          {
            id: 'init-1',
            sender: 'game_master',
            text: `تم استدعاؤك رسمياً لمسرح الجريمة: [${state.draft.dossier?.crimeSceneLocation || 'المسرح'}].\nالضحية: ${state.draft.dossier?.victimName || 'شخص غير معروف'}.\nابدأ بمعاينة مسرح الجريمة أو استدعاء أي من المشتبه بهم للاستجواب فوراً.`,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          }
        ],
        assistantChat: [
          {
            id: 'ast-1',
            sender: 'assistant',
            text: `مرحباً بك أيها المحقق. أنا مستشارك الجنائي والقانوني وفق [النظام ${state.legalSystem}].\nسأراقب معك ما يدور في مسرح الجريمة لتقديم التوجيهات ورصد أي تناقضات قانونية.`,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          }
        ]
      };

      state.cases.unshift(newCase);
      state.activeCaseId = newId;
      state.draft = null;
      state.isNewCaseOpen = false;
      saveCases();
      render();
    }

    async function sendInvestigationAction(text) {
      const c = getActiveCase();
      if (!c || state.isInvestigationLoading) return;

      state.investigationError = '';
      c.investigationChat.push({
        id: `msg-${Date.now()}`,
        sender: 'user',
        text,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      state.isInvestigationLoading = true;
      render();

      const secret = deobfuscate(c.encryptedSecretSolution);
      const systemPrompt = `
أنت "محقق مسرح الجريمة وإدارة الاستجواب" (Game Master) في محاكي التحقيق الجنائي.
معلومات القضية: ${c.title} - ${c.dossier?.crimeSceneLocation} - نظام ${c.parameters?.legalSystem}.
الحل السري المخفي (ممنوع كشفه مباشرة إلا بمحاصرة المتهم بالأدلة):
- الجاني: ${secret.culpritName}
- الدافع: ${secret.motive}
- الأداة: ${secret.weaponOrMethod}
- الدليل: ${secret.keyEvidence}
- ثغرة الحجة: ${secret.flawInAlibi}

تعليمات:
1. تقمص الشخصيات بواقعية وذكاء. الجاني سيكذب ويراوغ حتى يسقط في ثغرته.
2. إذا تم كشف دليل جديد، أضف كتلة JSON في نهاية ردك:
\`\`\`evidence_log
{ "newEvidence": [{ "id": "ev-${Date.now()}", "name": "اسم الدليل", "type": "مادي/فني", "description": "وصفه" }] }
\`\`\`
      `.trim();

      const contents = c.investigationChat.map(m => ({
        role: m.sender === 'user' ? 'user' : 'model',
        parts: [{ text: m.text }]
      }));

      try {
        const raw = await callGemini(contents, systemPrompt);
        let cleanText = raw;
        const evRegex = /```evidence_log\s*([\s\S]*?)\s*```/i;
        const match = raw.match(evRegex);
        if (match) {
          try {
            const parsed = JSON.parse(match[1].trim());
            if (Array.isArray(parsed.newEvidence)) {
              const existingIds = new Set(c.evidenceList.map(e => e.id));
              parsed.newEvidence.forEach(ne => { if (!existingIds.has(ne.id)) c.evidenceList.push(ne); });
            }
          } catch(e) {}
          cleanText = raw.replace(evRegex, '').trim();
        }

        c.investigationChat.push({
          id: `msg-${Date.now()}`,
          sender: 'game_master',
          text: cleanText,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        saveCases();
      } catch (err) {
        state.investigationError = err.message || 'فشل الاتصال بمحرك التحقيق.';
      } finally {
        state.isInvestigationLoading = false;
        render();
      }
    }

    function handleInvestigationSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('investigation-input');
      const val = input ? input.value.trim() : '';
      if (val) {
        input.value = '';
        sendInvestigationAction(val);
      }
    }

    async function askAssistantAction(text) {
      const c = getActiveCase();
      if (!c || state.isAssistantLoading) return;

      state.assistantError = '';
      c.assistantChat.push({
        id: `ast-${Date.now()}`,
        sender: 'user',
        text,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      state.isAssistantLoading = true;
      render();

      const context = c.investigationChat.map(m => `[${m.sender === 'user' ? 'المحقق' : 'المسرح/المشتبه به'}]: ${m.text}`).join('\n\n');
      const promptWithContext = `[سجل أحداث التحقيق حتى الآن]:\n${context}\n---\n[سؤال المحقق للاستشارة]:\n${text}`;
      
      const systemPrompt = `
أنت "المستشار القانوني والجنائي للمحقق" (Senior Legal Advisor).
النظام المعتمد: ${c.parameters?.legalSystem || 'السعودي'}.
حلل أقوال المشتبه بهم واستخرج التناقضات الزمنية والمكانية واقترح أسئلة استجواب تكتيكية دون حرق الحل النهائي.
      `.trim();

      const contents = c.assistantChat.map(m => ({
        role: m.sender === 'user' ? 'user' : 'model',
        parts: [{ text: m.text }]
      }));
      contents[contents.length - 1].parts[0].text = promptWithContext;

      try {
        const reply = await callGemini(contents, systemPrompt);
        c.assistantChat.push({
          id: `ast-${Date.now()}`,
          sender: 'assistant',
          text: reply.trim(),
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        saveCases();
      } catch (err) {
        state.assistantError = err.message || 'فشل استشارة المساعد.';
      } finally {
        state.isAssistantLoading = false;
        render();
      }
    }

    function handleAssistantSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('assistant-input');
      const val = input ? input.value.trim() : '';
      if (val) {
        input.value = '';
        askAssistantAction(val);
      }
    }

    async function handleIndictmentSubmit(e) {
      e.preventDefault();
      const c = getActiveCase();
      if (!c) return;

      const accused = document.getElementById('accused-select').value;
      const motive = document.getElementById('accused-motive').value.trim();
      const weapon = document.getElementById('accused-weapon').value.trim();
      const evidence = document.getElementById('accused-evidence').value.trim();

      const narrative = `[لائحة الاتهام الرسمية]:\nالمتهم: ${accused}\nالدافع: ${motive}\nالأداة: ${weapon || 'غير محدد'}\nالدليل الحاسم: ${evidence || 'الأدلة المادية'}`;
      c.investigationChat.push({
        id: `ind-${Date.now()}`,
        sender: 'user',
        text: narrative,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      state.isIndictmentLoading = true;
      render();

      const secret = deobfuscate(c.encryptedSecretSolution);
      const evalPrompt = `
المحقق أغلق القضية وقدم لائحة الاتهام:
${narrative}

الحل السري الحقيقي:
الجاني: ${secret.culpritName}
الدافع: ${secret.motive}
الأداة: ${secret.weaponOrMethod}
الدليل الحاسم: ${secret.keyEvidence}
ثغرة حجة الغياب: ${secret.flawInAlibi}
الرواية الكاملة: ${secret.fullNarrative}

المطلوب:
1. إصدار حكم المحكمة النهائي بناءً على صحة اتهام المحقق وفق النظام القضائي (${c.parameters?.legalSystem}).
2. كشف الرواية الحقيقية الكاملة لما حدث خلف الكواليس بأسلوب بوليسي مشوق.
      `.trim();

      try {
        const raw = await callGemini([{ role: 'user', parts: [{ text: evalPrompt }] }], 'أنت قاضي المحكمة ومحرك التحقيق الجنائي.');
        c.investigationChat.push({
          id: `verdict-${Date.now()}`,
          sender: 'game_master',
          text: raw.trim(),
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        c.isSolved = true;
        c.indictmentResult = { accused, verdictText: raw.trim() };
        saveCases();
        state.isIndictmentOpen = false;
      } catch (err) {
        state.investigationError = err.message || 'فشل مداولة لائحة الاتهام.';
      } finally {
        state.isIndictmentLoading = false;
        render();
      }
    }

    function copyNotepad() {
      try {
        navigator.clipboard.writeText(state.notepadContent);
      } catch(e) {
        const ta = document.getElementById('notepad-textarea');
        if (ta) {
          ta.select();
          document.execCommand('copy');
        }
      }
    }

    function clearNotepad() {
      state.notepadContent = '';
      safeStore.setItem(STORAGE_KEYS.NOTEPAD, '');
      const area = document.getElementById('notepad-textarea');
      if (area) area.value = '';
    }

    function start() {
      try { render(); } catch (e) { showFatal(e); }
      setTimeout(() => {
        if (typeof tailwind === 'undefined') {
          const w = document.getElementById('boot-warning');
          if (w) w.style.display = 'block';
        }
      }, 2500);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  </script>
</body>
</html>
