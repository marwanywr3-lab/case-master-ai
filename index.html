<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CaseMaster AI | محاكي التحقيق الجنائي القانوني</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ef4444' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'></circle><line x1='21' y1='21' x2='16.65' y2='16.65'></line></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            noir: {
              950: '#07080b',
              900: '#0d0f14',
              850: '#141820',
              800: '#1c222e',
              750: '#242c3b',
              700: '#2e384b',
              accent: '#ef4444',
            }
          },
          fontFamily: {
            sans: ['Tajawal', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace']
          }
        }
      }
    };
  </script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background-color: #07080b; color: #e2e8f0; overflow: hidden;
      font-family: 'Tajawal', sans-serif;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0d0f14; }
    ::-webkit-scrollbar-thumb { background: #242c3b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #ef4444; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-noir-950 text-slate-200">
  <div id="app" class="h-full w-full flex overflow-hidden relative"></div>

  <script>
    const STORAGE_KEYS = {
      API_KEY: 'casemaster_gemini_api_key',
      SELECTED_MODEL: 'casemaster_gemini_model',
      CASES_LIST: 'casemaster_cases_history',
      ACTIVE_CASE_ID: 'casemaster_active_case_id',
      NOTEPAD: 'casemaster_investigator_notepad',
    };

    const SUPPORTED_MODELS = {
      LITE: 'gemini-2.5-flash',
      FLASH: 'gemini-2.5-pro',
    };

    const state = {
      apiKey: localStorage.getItem(STORAGE_KEYS.API_KEY) || '',
      selectedModel: localStorage.getItem(STORAGE_KEYS.SELECTED_MODEL) || SUPPORTED_MODELS.LITE,
      cases: (() => {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEYS.CASES_LIST)) || [];
        } catch { return []; }
      })(),
      activeCaseId: localStorage.getItem(STORAGE_KEYS.ACTIVE_CASE_ID) || null,
      notepadContent: localStorage.getItem(STORAGE_KEYS.NOTEPAD) || '',
      mobileTab: 'investigation',
      dossierTab: 'evidence',
      isSidebarOpen: false,
      isSettingsOpen: false,
      isNewCaseOpen: false,
      isIndictmentOpen: false,
      
      draft: null,
      isGeneratingCase: false,
      newCaseError: '',
      difficulty: 'متوسط',
      legalSystem: 'السعودي',
      depth: 'متوسط',
      customSeed: '',

      isInvestigationLoading: false,
      isAssistantLoading: false,
      isIndictmentLoading: false,
      investigationError: '',
      assistantError: '',
    };

    function saveCases() {
      localStorage.setItem(STORAGE_KEYS.CASES_LIST, JSON.stringify(state.cases));
    }

    function getActiveCase() {
      return state.cases.find(c => c.id === state.activeCaseId) || null;
    }

    function obfuscate(obj) {
      try {
        return btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
      } catch {
        return JSON.stringify(obj);
      }
    }

    function deobfuscate(str) {
      try {
        return JSON.parse(decodeURIComponent(escape(atob(str))));
      } catch {
        try { return JSON.parse(str); } catch { return {}; }
      }
    }

    async function callGemini(contents, systemInstruction) {
      if (!state.apiKey) throw new Error('يرجى إدخال مفتاح Gemini API أولاً في الإعدادات.');
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(state.selectedModel)}:generateContent?key=${encodeURIComponent(state.apiKey.trim())}`;
      
      const body = {
        contents,
        generationConfig: { maxOutputTokens: 4096 }
      };
      if (systemInstruction) {
        body.systemInstruction = { parts: [{ text: systemInstruction }] };
      }

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const msg = data?.error?.message || res.statusText;
        if (res.status === 400 && msg.includes('API_KEY_INVALID')) {
          throw new Error('مفتاح Gemini API غير صالح. تأكد من نسخه بشكل صحيح من Google AI Studio.');
        }
        if (res.status === 429) {
          throw new Error('تم تجاوز حد الاستخدام المسموح (Rate Limit). انتظر دقيقة واحدة.');
        }
        throw new Error(`خطأ من Gemini [${res.status}]: ${msg}`);
      }

      const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) throw new Error('لم يتم إرجاع أي نص من النموذج.');
      return text;
    }

    function extractJSON(text) {
      const match = text.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
      const str = match ? match[1].trim() : text.trim();
      try { return JSON.parse(str); }
      catch {
        const s = str.indexOf('{'), e = str.lastIndexOf('}');
        if (s !== -1 && e > s) return JSON.parse(str.substring(s, e + 1));
        throw new Error('تعذر قراءة بيانات JSON من النموذج.');
      }
    }

    function render() {
      const app = document.getElementById('app');
      const activeCase = getActiveCase();

      app.innerHTML = `
        ${state.isSidebarOpen ? '<div onclick="state.isSidebarOpen = false; render();" class="fixed inset-0 z-40 bg-black/75 backdrop-blur-sm lg:hidden"></div>' : ''}
        
        <aside class="fixed lg:static inset-y-0 right-0 z-50 w-72 sm:w-80 lg:w-64 xl:w-72 h-full bg-noir-950 border-l lg:border-l-0 lg:border-r border-noir-800 flex flex-col flex-shrink-0 select-none transition-transform duration-300 ${state.isSidebarOpen ? 'translate-x-0' : 'translate-x-full lg:translate-x-0'}">
          <div class="h-14 px-4 border-b border-noir-800 flex items-center justify-between bg-noir-900/80">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg bg-red-600/20 border border-red-500/50 flex items-center justify-center text-red-500 font-bold text-sm">⚖️</div>
              <div>
                <h1 class="text-xs font-black tracking-wide text-slate-100 uppercase">CaseMaster <span class="text-red-500">AI</span></h1>
                <p class="text-[10px] text-slate-400 font-mono">محاكي التحقيق الجنائي</p>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="state.isSettingsOpen = true; render();" class="p-2 rounded-lg border transition ${state.apiKey ? 'text-slate-400 hover:text-white bg-noir-850 border-noir-800' : 'text-amber-400 bg-amber-950/40 border-amber-600/50 animate-pulse'}" title="الإعدادات">⚙️</button>
              <button onclick="state.isSidebarOpen = false; render();" class="lg:hidden p-2 rounded-lg bg-noir-850 text-slate-400 hover:text-white border border-noir-800">✕</button>
            </div>
          </div>

          <div class="p-3 border-b border-noir-800">
            <button onclick="state.isNewCaseOpen = true; state.isSidebarOpen = false; render();" class="w-full py-2.5 px-3 rounded-lg bg-red-600 hover:bg-red-500 text-white text-xs font-bold shadow-md transition flex items-center justify-center gap-2 min-h-[44px]">
              + فتح ملف قضية جديدة
            </button>
          </div>

          <div class="flex-1 overflow-y-auto p-2.5 space-y-1.5">
            <div class="px-2 py-1 flex items-center justify-between text-[10px] font-mono text-slate-500 uppercase">
              <span>سجل القضايا (${state.cases.length})</span>
              <span>الحالة</span>
            </div>
            ${state.cases.length === 0 ? '<div class="py-12 px-4 text-center text-slate-600 text-xs">لا توجد قضايا سابقة. افتح ملف قضية للبدء.</div>' : ''}
            ${state.cases.map(c => `
              <div onclick="state.activeCaseId = '${c.id}'; state.isSidebarOpen = false; render();" class="p-3 rounded-lg cursor-pointer border transition text-right ${c.id === state.activeCaseId ? 'bg-noir-850 border-red-500/60 shadow-sm' : 'bg-noir-900/50 border-noir-800 hover:bg-noir-850 text-slate-400'}">
                <div class="flex items-center justify-between gap-1 mb-1">
                  <span class="text-xs font-bold truncate ${c.id === state.activeCaseId ? 'text-white' : 'text-slate-300'}">${escapeHtml(c.title)}</span>
                  <span class="text-[9px] px-1.5 py-0.5 rounded font-mono border ${c.isSolved ? 'bg-emerald-950/60 text-emerald-400 border-emerald-500/30' : 'bg-red-950/50 text-red-400 border-red-500/30'}">${c.isSolved ? 'مغلقة' : 'جارية'}</span>
                </div>
                <div class="flex items-center justify-between text-[10px] text-slate-500 font-mono">
                  <span>${escapeHtml(c.parameters?.legalSystem \vert{}\vert{} 'نظام')} \vert{} ${escapeHtml(c.parameters?.difficulty || 'متوسط')}</span>
                  <button onclick="event.stopPropagation(); deleteCase('${c.id}');" class="hover:text-red-400 p-1 rounded transition text-xs" title="حذف">🗑️</button>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="p-3 border-t border-noir-800 bg-noir-900/50 flex items-center justify-between text-[11px] font-mono">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full ${state.apiKey ? 'bg-emerald-500' : 'bg-amber-500 animate-ping'}"></span>
              <span class="text-slate-400">${state.apiKey ? 'المحرك متصل' : 'المفتاح مفقود'}</span>
            </div>
            <span class="text-[10px] text-slate-400 bg-noir-800 px-1.5 py-0.5 rounded border border-noir-750">${state.selectedModel}</span>
          </div>
        </aside>

        <!-- Main Workspace Area -->
        <main class="flex-1 flex flex-col h-full min-w-0 overflow-hidden relative">
          <header class="lg:hidden flex items-center justify-between border-b border-noir-800 bg-noir-900 px-3 py-2 z-30 flex-shrink-0">
            <div class="flex items-center gap-2">
              <button onclick="state.isSidebarOpen = true; render();" class="p-2 rounded bg-noir-850 text-slate-300 border border-noir-800">☰</button>
              <div class="truncate max-w-[170px]">
                <h2 class="text-xs font-bold text-slate-100 truncate">${activeCase ? escapeHtml(activeCase.title) : 'CaseMaster AI'}</h2>
                ${activeCase ? `<span class="text-[10px] text-red-400 font-mono">نظام ${escapeHtml(activeCase.parameters?.legalSystem)}</span>` : ''}
              </div>
            </div>
            <button onclick="state.isNewCaseOpen = true; render();" class="text-xs font-bold bg-red-600/20 border border-red-500/40 text-red-300 px-2.5 py-1.5 rounded">+ قضية</button>
          </header>

          ${!activeCase ? renderEmptyState() : renderActiveCaseWorkspace(activeCase)}
        </main>

        <!-- Modals -->
        ${state.isSettingsOpen ? renderSettingsModal() : ''}
        ${state.isNewCaseOpen ? renderNewCaseModal() : ''}
        ${state.isIndictmentOpen && activeCase ? renderIndictmentModal(activeCase) : ''}
      `;

      bindEvents();
    }

    function renderEmptyState() {
      return `
        <div class="flex-1 flex flex-col items-center justify-center p-6 text-center bg-noir-900/40">
          <div class="max-w-md w-full p-8 rounded-2xl bg-noir-900 border border-noir-800 shadow-2xl space-y-4">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-red-600/10 border border-red-500/30 flex items-center justify-center text-3xl">⚖️</div>
            <h2 class="text-lg font-bold text-slate-100">مرحباً بك في CaseMaster AI</h2>
            <p class="text-xs text-slate-400 leading-relaxed">
              محاكي التحقيق الجنائي التفاعلي بنماذج Google Gemini. اختر مواصفات القضية، عاين مسرح الجريمة، استجوب المشتبه بهم، واستعن بالمستشار القانوني لكشف الحقيقة.
            </p>
            <div class="pt-2">
              <button onclick="state.isNewCaseOpen = true; render();" class="w-full py-3 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold shadow-lg transition">
                فتح ملف قضية جديدة ←
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderActiveCaseWorkspace(c) {
      return `
        <div class="flex-1 flex flex-col lg:flex-row h-full min-h-0 overflow-hidden">
          <div class="hidden lg:flex flex-1 h-full min-w-0 overflow-hidden">
            ${renderAssistantColumn(c)}
            ${renderInvestigationColumn(c)}
            ${renderDossierColumn(c)}
          </div>

          <div class="lg:hidden flex-1 h-full min-h-0 overflow-hidden flex flex-col">
            <div class="flex-1 min-h-0 overflow-hidden">
              ${state.mobileTab === 'investigation' ? renderInvestigationColumn(c) : ''}
              ${state.mobileTab === 'assistant' ? renderAssistantColumn(c) : ''}
              ${state.mobileTab === 'dossier' ? renderDossierColumn(c) : ''}
            </div>
            
            <nav class="border-t border-noir-800 bg-noir-900 px-2 py-1.5 flex items-center justify-around z-20 flex-shrink-0">
              <button onclick="state.mobileTab = 'investigation'; render();" class="flex-1 py-1.5 rounded text-xs font-bold transition flex flex-col items-center ${state.mobileTab === 'investigation' ? 'bg-red-600/20 text-red-400 border border-red-500/40' : 'text-slate-400'}">
                <span class="text-sm">🔍</span>
                <span>المسرح والاستجواب</span>
              </button>
              <button onclick="state.mobileTab = 'assistant'; render();" class="flex-1 py-1.5 rounded text-xs font-bold transition flex flex-col items-center ${state.mobileTab === 'assistant' ? 'bg-sky-600/20 text-sky-400 border border-sky-500/40' : 'text-slate-400'}">
                <span class="text-sm">⚖️</span>
                <span>المستشار القانوني</span>
              </button>
              <button onclick="state.mobileTab = 'dossier'; render();" class="flex-1 py-1.5 rounded text-xs font-bold transition flex flex-col items-center ${state.mobileTab === 'dossier' ? 'bg-amber-600/20 text-amber-400 border border-amber-500/40' : 'text-slate-400'}">
                <span class="text-sm">📁</span>
                <span>الأدلة والملاحظات</span>
              </button>
            </nav>
          </div>
        </div>
      `;
    }

    function renderInvestigationColumn(c) {
      return `
        <div class="flex-1 h-full min-w-0 flex flex-col bg-noir-900 border-x-0 lg:border-x border-noir-800">
          <div class="h-14 px-4 border-b border-noir-800 bg-noir-950/80 flex items-center justify-between">
            <div class="truncate">
              <h2 class="text-xs sm:text-sm font-bold text-slate-100 truncate">${escapeHtml(c.title)}</h2>
              <p class="text-[10px] text-slate-400 font-mono truncate">المسرح: ${escapeHtml(c.dossier?.crimeSceneLocation || 'غير محدد')} | نظام ${escapeHtml(c.parameters?.legalSystem || 'السعودي')}</p>
            </div>
            <div>
              ${c.isSolved
                ? '<span class="text-xs font-bold text-emerald-400 bg-emerald-950/50 border border-emerald-500/40 px-3 py-1 rounded-full">✓ مغلقة</span>'
                : '<button onclick="state.isIndictmentOpen = true; render();" class="text-xs font-bold bg-red-600/20 hover:bg-red-600/30 border border-red-500/50 text-red-300 px-3 py-1.5 rounded-lg transition">⚖️ تقديم لائحة الاتهام</button>'
              }
            </div>
          </div>

          <div id="investigation-messages" class="flex-1 overflow-y-auto p-4 space-y-3.5">
            ${c.investigationChat.map(m => `
              <div class="flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}">
                <span class="text-[10px] font-mono mb-1 ${m.sender === 'user' ? 'text-red-400' : 'text-slate-400'}">
                  ${m.sender === 'user' ? 'المحقق' : 'إدارة المسرح والاستجواب'} • ${escapeHtml(m.timestamp)}
                </span>
                <div class="p-3.5 rounded-xl text-xs sm:text-sm leading-relaxed whitespace-pre-line border max-w-[90%] sm:max-w-[80%] ${                   m.sender === 'user' ? 'bg-red-950/30 border-red-500/40 text-slate-100' : 'bg-noir-850 border-noir-800 text-slate-200 shadow-md'                 }">${escapeHtml(m.text)}</div>
              </div>
            `).join('')}
            ${state.isInvestigationLoading ? '<div class="text-xs text-red-400 p-2.5 bg-noir-850 rounded border border-noir-800 animate-pulse">جاري التحري واستجواب الأطراف...</div>' : ''}
            ${state.investigationError ? `<div class="text-xs text-red-300 p-2.5 bg-red-950/50 rounded border border-red-600/40">${escapeHtml(state.investigationError)}</div>` : ''}
          </div>

          ${!c.isSolved ? `
            <div class="px-3 py-2 border-t border-noir-800 bg-noir-950/50 flex gap-2 overflow-x-auto text-xs no-scrollbar">
              <button onclick="sendInvestigationAction('أريد فحص مسرح الجريمة بحثاً عن آثار أقدام أو بصمات أو دلائل مادية جديدة.');" class="px-2.5 py-1.5 rounded bg-noir-850 hover:bg-noir-800 border border-noir-800 text-slate-300 flex-shrink-0">🔍 مسح المسرح</button>
              <button onclick="sendInvestigationAction('اطلب تقرير الطب الشرعي المفصل حول وقت وطريقة الوفاة بدقة.');" class="px-2.5 py-1.5 rounded bg-noir-850 hover:bg-noir-800 border border-noir-800 text-slate-300 flex-shrink-0">🩺 تقرير الطب الشرعي</button>
              ${(c.dossier?.suspects || []).map((s, idx) => `
                <button onclick="interrogateSuspectByIndex(${idx});" class="px-2.5 py-1.5 rounded bg-noir-850 hover:bg-noir-800 border border-noir-800 text-amber-300 flex-shrink-0">👤 استجواب ${escapeHtml(s.name)}</button>
              `).join('')}
            </div>
            
            <div class="p-3 border-t border-noir-800 bg-noir-950">
              <form id="investigation-form" onsubmit="handleInvestigationSubmit(event);" class="flex gap-2">
                <input id="investigation-input" type="text" placeholder="وجه سؤالاً، استدعِ شاهداً، أو اطلب إجراءً جنائياً..." class="flex-1 px-3.5 py-2.5 rounded-lg bg-noir-850 border border-noir-800 text-xs sm:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-500 min-h-[42px]" />
                <button type="submit" class="px-4 py-2.5 rounded-lg bg-red-600 hover:bg-red-500 text-white font-bold text-xs">إرسال</button>
              </form>
            </div>
          ` : `
            <div class="p-3 border-t border-noir-800 bg-noir-950 text-center text-xs text-slate-400">تم إغلاق ملف القضية وصدور الحكم النهائي.</div>
          `}
        </div>
      `;
    }

    function renderAssistantColumn(c) {
      return `
        <div class="w-full lg:w-80 xl:w-96 h-full flex flex-col bg-noir-950 border-r border-noir-800 flex-shrink-0">
          <div class="h-14 px-4 border-b border-noir-800 bg-noir-900/80 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <div class="w-7 h-7 rounded-lg bg-sky-500/20 text-sky-400 flex items-center justify-center text-xs">⚖️</div>
              <div>
                <h3 class="text-xs font-bold text-slate-100">المستشار القانوني</h3>
                <p class="text-[10px] text-sky-400 font-mono">النظام ${escapeHtml(c.parameters?.legalSystem || 'السعودي')}</p>
              </div>
            </div>
            <span class="text-[9px] font-mono bg-noir-850 px-2 py-0.5 rounded text-slate-400 border border-noir-800">ADVISOR</span>
          </div>

          <div id="assistant-messages" class="flex-1 overflow-y-auto p-3.5 space-y-3">
            ${c.assistantChat.map(m => `
              <div class="flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}">
                <span class="text-[10px] font-mono mb-1 ${m.sender === 'user' ? 'text-red-400' : 'text-sky-400'}">
                  ${m.sender === 'user' ? 'المحقق' : 'المستشار'} • ${escapeHtml(m.timestamp)}
                </span>
                <div class="p-3 rounded-xl text-xs leading-relaxed whitespace-pre-line border max-w-[92%] ${                   m.sender === 'user' ? 'bg-red-950/30 border-red-500/30 text-slate-200' : 'bg-noir-900 border-noir-800 text-slate-300 shadow-sm'                 }">${escapeHtml(m.text)}</div>
              </div>
            `).join('')}
            ${state.isAssistantLoading ? '<div class="text-xs text-sky-400 p-2 bg-noir-900 rounded border border-noir-800 animate-pulse">جاري تحليل الأقوال والثغرات...</div>' : ''}
            ${state.assistantError ? `<div class="text-xs text-red-400 p-2 bg-red-950/40 rounded border border-red-600/40">${escapeHtml(state.assistantError)}</div>` : ''}
          </div>

          <div class="p-2 border-t border-noir-850 bg-noir-900/70 space-y-1">
            <button onclick="askAssistantAction('حلل أقوال المشتبه بهم واستخرج التناقضات الزمنية أو المكانية.');" class="w-full text-right text-[11px] p-1.5 rounded bg-noir-850 hover:bg-noir-800 text-slate-300 border border-noir-800 truncate">🔍 فحص التناقضات بين الأقوال</button>

                evidence.length === 0 ? '<div class="text-center text-slate-600 text-xs py-8">لم يتم تحريز أي أدلة بعد.</div>' :
                evidence.map(ev => `
                  <div class="p-2.5 rounded bg-noir-900 border border-noir-800 space-y-1">

              ) : ''}

                </div>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }
